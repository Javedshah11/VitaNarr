name: vitanarr

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: vitanarr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vitanarr}
      POSTGRES_USER: ${POSTGRES_USER:-vitanarr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace_me}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - vitanarr_postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - vitanarr

  redis:
    image: redis:8-alpine
    container_name: vitanarr-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - vitanarr_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - vitanarr

volumes:
  vitanarr_postgres_data:
  vitanarr_redis_data:

networks:
  vitanarr:
    driver: bridge
